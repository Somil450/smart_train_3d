# Mosquitto configuration for SmartRail MQTT
# Enables:
#   - Plain MQTT on port 1883  (for ESP32)
#   - WebSocket on port 9001   (for Flutter web app in Chrome)

# Allow anonymous connections (no username/password needed for local demo)
allow_anonymous true

# Standard MQTT listener (ESP32 connects here)
listener 1883 0.0.0.0

# WebSocket listener (Flutter web app in Chrome connects here)
listener 9001 0.0.0.0
protocol websockets
